<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>tile 440x280</title>
<style>
  body {
    margin: 0; width: 440px; height: 280px; overflow: hidden;
    background: #1b2430;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; color: #fff;
  }
  .marker {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.85); color: #fff;
    font: 700 12px/22px ui-monospace, monospace; text-align: center;
  }
  .area {
    position: absolute; border: 2px dashed rgba(36,86,230,.55); border-radius: 4px;
  }
  .mark {
    width: 54px; height: 54px; border-radius: 50%;
    background: #2456e6; color: #fff;
    font: 700 26px/54px ui-monospace, monospace; text-align: center;
    border: 3px solid #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .01em; }
  p { margin: 8px 0 0; font-size: 14px; color: #9fb0c7; }
</style>
</head>
<body>
  <div class="area" style="left:24px;top:32px;width:110px;height:64px"></div>
  <div class="marker" style="left:14px;top:22px;background:#d8372a">2</div>
  <div class="marker" style="right:34px;top:52px;background:#2e9e5b">3</div>
  <div class="marker" style="right:80px;bottom:36px;background:#d97e00">4</div>
  <div class="mark">1</div>
  <h1>Easy Annotation</h1>
  <p>Mark up any webpage — number, comment, share</p>
</body>
</html>
