<!doctype html>

  .feats { margin: 26px 0 0; display: flex; gap: 14px; }

    padding: 7px 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 99px;
    font-size: 15px; color: #c9d2de;
  }

</head>
